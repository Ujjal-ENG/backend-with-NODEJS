services:
  - type: web
    name: live-bd-deals-scraper
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: CACHE_TTL_MINUTES
        value: 15
      - key: SCRAPE_TIMEOUT_MS
        value: 45000
      - key: SOURCE_TIMEOUT_MS
        value: 18000
      - key: REQUEST_TIMEOUT_MS
        value: 15000
      - key: REQUEST_DELAY_MS
        value: 900
      - key: MAX_PAGES_PER_SOURCE
        value: 5
      - key: MAX_DEALS_PER_SOURCE
        value: 50
      - key: PUPPETEER_ARGS
        value: --no-sandbox,--disable-setuid-sandbox
      - key: REFRESH_TOKEN
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_IDS
        sync: false
